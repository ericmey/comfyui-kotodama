name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install ${{ matrix.python }}
      - name: Lint
        run: uv run --frozen --python ${{ matrix.python }} --group dev ruff check .
      - name: Tests
        run: uv run --frozen --python ${{ matrix.python }} --group dev pytest -q
